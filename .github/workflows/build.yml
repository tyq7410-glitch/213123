name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Works even if the project was uploaded inside a subfolder.
      - name: Find the project folder
        id: proj
        run: |
          echo "--- files in the repository ---"
          find . -not -path './.git/*' -type f | head -80
          GRADLE_FILE=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::build.gradle not found. Upload the CONTENTS of the AuroraCheatClient folder (build.gradle, settings.gradle, gradle.properties, src ...) to the repository."
            exit 1
          fi
          DIR=$(dirname "$GRADLE_FILE")
          if [ ! -d "$DIR/src/main/java" ]; then
            echo "::error::Folder $DIR/src/main/java is missing. The src folder was not uploaded."
            exit 1
          fi
          echo "Project folder: $DIR"
          echo "Java files: $(find "$DIR/src" -name '*.java' | wc -l) (expected 25)"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Check the jar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' | head -1)
          SIZE=$(stat -c%s "$JAR")
          CLASSES=$(unzip -l "$JAR" | grep -c '\.class' || true)
          echo "jar: $JAR  size: $SIZE bytes  classes: $CLASSES"
          if [ "$SIZE" -lt 50000 ] || [ "$CLASSES" -lt 50 ]; then
            echo "::error::The jar is too small ($SIZE bytes, $CLASSES classes). The build is incomplete."
            exit 1
          fi
          mkdir -p dist
          cp "$JAR" dist/aurora-cheat-client.jar

      - name: Upload jar (Actions -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: aurora-cheat-client
          path: ${{ steps.proj.outputs.dir }}/dist/aurora-cheat-client.jar
          if-no-files-found: error

      - name: Publish release (when you push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/dist/aurora-cheat-client.jar
